<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="Hero photograph placeholder">
  <!-- Brand-neutral stand-in for the wide photograph a showcase slide wants.
       Merchants replace it with real photography from the admin portal. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2B3440"/>
      <stop offset="1" stop-color="#141A22"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5136"/>
      <stop offset="1" stop-color="#3E2E1E"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.74" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#FFE6B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE6B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4E6E8E"/>
      <stop offset="1" stop-color="#22303F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" fill="url(#room)"/>
  <rect y="470" width="1600" height="250" fill="url(#desk)"/>
  <rect width="1600" height="720" fill="url(#lamp)"/>

  <!-- Window, back left -->
  <g opacity="0.5">
    <rect x="150" y="70" width="330" height="330" rx="10" fill="#7E94A8" opacity="0.35"/>
    <path d="M315 70v330M150 235h330" stroke="#101820" stroke-width="12"/>
  </g>

  <!-- Laptop, the subject, sitting right of the copy column -->
  <g>
    <path d="M905 240h430a14 14 0 0 1 14 14v276H891V254a14 14 0 0 1 14-14Z" fill="#1B2027"/>
    <rect x="921" y="268" width="398" height="234" rx="6" fill="url(#screen)"/>
    <path d="M846 530h548l38 44a10 10 0 0 1-8 16H816a10 10 0 0 1-8-16Z" fill="#242B33"/>
    <rect x="960" y="556" width="320" height="10" rx="5" fill="#171C22"/>
  </g>

  <!-- Desk lamp, top right -->
  <g stroke="#0E1319" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M1500 470v-150l-70-90"/>
  </g>
  <path d="M1372 210l116-38 40 96-116 38z" fill="#0E1319"/>

  <!-- Mug and notebook on the desk -->
  <rect x="700" y="520" width="112" height="96" rx="12" fill="#171C22"/>
  <path d="M812 546h30a26 26 0 0 1 0 52h-30z" fill="none" stroke="#171C22" stroke-width="14"/>
  <rect x="1180" y="590" width="300" height="88" rx="8" fill="#E9E3D6" opacity="0.9"/>
  <path d="M1210 634h240" stroke="#B9B0A0" stroke-width="8" stroke-linecap="round"/>

  <!-- Plant, back right -->
  <g fill="#3E6B4A" opacity="0.85">
    <path d="M1560 300c-40 20-60 60-56 104 44-8 74-42 78-92z"/>
    <path d="M1600 250c-52 4-88 34-100 78 46 10 84-8 104-52z"/>
  </g>
</svg>
